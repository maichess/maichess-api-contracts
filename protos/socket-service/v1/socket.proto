syntax = "proto3";

package socket.v1;

option csharp_namespace = "Socket.V1";
option java_multiple_files = true;
option java_package = "socket.v1";

// The Socket gRPC service has been removed (Kafka task 09).
//
// Real-time delivery is now event-driven: producers publish an OutboundEvent to
// the socket.outbound.v1 Kafka topic (see events/v1/socket_outbound.proto) and the
// socket service consumes that topic and fans out to clients over socket.io. This
// replaced both former RPCs:
//   - EmitEvent (single-user push)       -> SocketPush.target_user_id
//   - BroadcastMatchEvent (room fan-out) -> SocketPush.target_match_id
//
// The socket service still acts as a gRPC *client* of Auth.ValidateToken to
// authenticate connecting clients; it no longer serves any gRPC endpoint.
//
// This file is retained to avoid a gap in the proto package version history. The
// generated stubs package should be bumped to reflect the removal.
