syntax = "proto3";

package maichess.user.v1;

option csharp_namespace = "Maichess.User.V1";
option java_multiple_files = true;
option java_package = "maichess.user.v1.users";

// Users manages player profiles.
// CreateUser and GetUser are called by Auth; GetUser and UpdateUser are also
// exposed via the User Service REST API.
service Users {
  // CreateUser creates a new player profile. Called by Auth on registration.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser returns a player's profile.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // UpdateUser updates mutable profile fields.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // RecordMatchResult records the outcome of a finished match for a single
  // player, incrementing their win/loss/draw counter. Called by Match Manager
  // once per human participant when a match ends. This is the single entry
  // point for player-stat mutations.
  rpc RecordMatchResult(RecordMatchResultRequest) returns (RecordMatchResultResponse);
}

// MatchOutcome is the result of a finished match from one player's perspective.
enum MatchOutcome {
  MATCH_OUTCOME_UNSPECIFIED = 0;
  MATCH_OUTCOME_WIN = 1;
  MATCH_OUTCOME_LOSS = 2;
  MATCH_OUTCOME_DRAW = 3;
}

message User {
  string id = 1;
  string username = 2;
  // Display rating: the Glicko-2 rating rounded to the nearest integer. Kept so
  // existing clients can read a single integer strength without change.
  int32 elo = 3;
  int32 wins = 4;
  int32 losses = 5;
  int32 draws = 6;
  // Whether the player has opted into the client's developer area.
  bool dev_mode = 7;
  // Glicko-2 rating on the display scale (unrounded). elo is round(rating).
  double rating = 8;
  // Glicko-2 rating deviation on the display scale. High for new/inactive
  // players (seeded at 350), shrinking as games accumulate.
  double rating_deviation = 9;
  // Glicko-2 rating volatility (internal scale), seeded at 0.06.
  double volatility = 10;
}

message CreateUserRequest {
  string username = 1;
  // Password hash — Auth is responsible for hashing before calling this RPC.
  string password_hash = 2;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  // Optional so that "not provided" is distinguishable from false, letting
  // username and dev_mode be patched independently.
  optional bool dev_mode = 3;
}

message UpdateUserResponse {
  User user = 1;
}

message RecordMatchResultRequest {
  string user_id = 1;
  MatchOutcome outcome = 2;
  // The opponent's display-scale Glicko-2 rating at match time, supplied by
  // Match Manager so the rating update needs no extra lookup. For bot opponents
  // this is the bot's configured strength.
  double opponent_rating = 3;
  // The opponent's display-scale rating deviation at match time. Bots use a
  // low, fixed deviation (they are treated as having an established rating).
  double opponent_rd = 4;
}

message RecordMatchResultResponse {
  User user = 1;
}
